# docker-compose.infra.yml
# Infrastructure services for thrift-demo project
# Port range: 20000-25000 (server allocation)
# Network: infra-network (bridge)

services:
  # ============================================================================
  # Data Stores
  # ============================================================================
  
  mongodb:
    image: mongo:8.0
    container_name: huyng5-mongodb
    ports:
      - "20017:27017"
    environment:
      - MONGO_INITDB_DATABASE=config_control
    volumes:
      - mongodb_data:/data/db
    networks:
      - infra-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:latest
    container_name: huyng5-redis
    ports:
      - "20379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - infra-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  kafka:
    image: bitnami/kafka:3.9
    container_name: huyng5-kafka
    ports:
      - "20092:9092"
      - "20094:9094"
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://:9093,PLAINTEXT_HOST://0.0.0.0:9094
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://10.40.30.161:20092,PLAINTEXT_HOST://10.40.30.161:20094
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR=1
      - ALLOW_PLAINTEXT_LISTENER=yes
    volumes:
      - kafka_data:/bitnami/kafka
    networks:
      - infra-network
    healthcheck:
      test: ["CMD", "kafka-topics.sh", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  consul:
    image: hashicorp/consul:1.17
    container_name: huyng5-consul
    ports:
      - "20500:8500"
    environment:
      - CONSUL_BIND_INTERFACE=eth0
    command: >
      consul agent -dev 
      -client=0.0.0.0 
      -ui 
      -log-level=info 
      -data-dir=/consul/data
    volumes:
      - consul_data:/consul/data
    networks:
      - infra-network
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Prometheus - Metrics Scraping & Remote Write
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: huyng5-prometheus
    ports:
      - "23090:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus/prometheus-rules.yml:/etc/prometheus/rules/prometheus-rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--storage.tsdb.retention.time=200h"
      - "--web.enable-lifecycle"
      - "--web.enable-admin-api"
      - "--enable-feature=exemplar-storage"
      - "--web.enable-remote-write-receiver"
    networks:
      - infra-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  postgres:
    image: postgres:18.0-alpine
    container_name: huyng5-postgres
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
      POSTGRES_DB: keycloak
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "25432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - infra-network

    # Mailpit for email testing (dev)
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: huyng5-mailpit
    ports:
      - "28025:8025" # Web UI
      - "21025:1025" # SMTP
    networks:
      - infra-network
    volumes:
      - mailpit_data:/data
    restart: unless-stopped

  keycloak:
    image: hzeroxium/keycloak-custom:26.4.0
    container_name: huyng5-keycloak
    build:
      context: ./config-control-service/keycloak
      dockerfile: Dockerfile.keycloak
    env_file:
      # Load environment-specific Keycloak URLs
      # For local: use ./config/env/env.infra-local
      # For production: use ./config/env/env.infra-remote
      - ./config/env/env.infra-remote
    environment:
      # Bootstrap admin (bắt buộc khi chạy container)
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin

      # Database
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://10.40.30.161:25432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak

      # Hostname configuration
      # KC_HOSTNAME: Used for internal routing, can be Docker service name
      # When using edge proxy mode, Keycloak uses X-Forwarded-Host from nginx
      # Use Docker name if KEYCLOAK_HOSTNAME is not set
      # KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-keycloak}
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"

      # Observability
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      
      # Proxy mode: edge for nginx reverse proxy in front
      # This allows Keycloak to work properly with nginx proxy
      # Keycloak will trust X-Forwarded-* headers from nginx
      KC_PROXY: "edge"
      KC_PROXY_HEADERS: "xforwarded"
      
      # Frontend URL for redirects and cookies
      # This is CRITICAL: must match the URL where users access admin-dashboard
      # Loaded from env file (KEYCLOAK_FRONTEND_URL) with fallback
      KC_FRONTEND_URL: ${KEYCLOAK_FRONTEND_URL:-http://localhost:3000}
      
      # Internal URL for service-to-service communication
      # Loaded from env file (KEYCLOAK_INTERNAL_URL) with fallback
      # KC_HOSTNAME_URL: ${KEYCLOAK_INTERNAL_URL:-http://keycloak:8080}
      KC_HTTP_RELATIVE_PATH: /

    command:
      - start-dev
      - --log-level=com.example.keycloak.login:DEBUG,com.example.keycloak.registration:DEBUG,root:INFO

    ports:
      - "28080:8080" # HTTP (dev)
      - "29000:9000" # health/metrics
    volumes:
      - keycloak_data:/opt/keycloak/data
    restart: unless-stopped
    # Healthcheck Keycloak (ready) - disabled for now
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z localhost 9000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - infra-network

  # Keycloak initialization service
  keycloak-init:
    image: keycloak-init
    build:
      context: ./config-control-service/keycloak
      dockerfile: Dockerfile
    container_name: huyng5-keycloak-init
    depends_on:
      - keycloak
    networks:
      - infra-network
    restart: "no"
    environment:
      - KEYCLOAK_API_URL=http://keycloak:8080
      - KEYCLOAK_HEALTH_URL=http://keycloak:9000
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin

# ============================================================================
# Volumes
# ============================================================================

volumes:
  mongodb_data:
    name: infra_mongodb_data
  redis_data:
    name: infra_redis_data
  kafka_data:
    name: infra_kafka_data
  consul_data:
    name: infra_consul_data
  grafana_data:
    name: infra_grafana_data
  prometheus_data:
    name: infra_prometheus_data
  postgres_data:
    name: infra_postgres_data
  keycloak_data:
    name: infra_keycloak_data
  mailpit_data:
    name: infra_mailpit_data
# ============================================================================
# Networks
# ============================================================================

networks:
  infra-network:
    name: infra-network
    driver: bridge
    # external: true

