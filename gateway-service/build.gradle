plugins {
    alias(libs.plugins.java)
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.spring.dependency.management)
}

group = 'com.example'
version = '1.0.0'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
    all {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
        exclude group: 'ch.qos.logback', module: 'logback-classic'
    }
}

dependencyManagement {
    imports {
        mavenBom libs.spring.boot.bom.get().toString()
        mavenBom libs.spring.cloud.bom.get().toString()
    }
}

dependencies {
    // Spring Cloud Gateway
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway'
    implementation libs.spring.cloud.starter.consul.discovery
    implementation libs.spring.cloud.starter.loadbalancer
    
    // Resilience
    implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-reactor-resilience4j'
    implementation libs.resilience4j.circuitbreaker
    implementation libs.resilience4j.timelimiter
    
    // Redis for rate limiting (reactive)
    implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'
    implementation libs.lettuce.core
    
    // Caffeine cache for LoadBalancer (recommended for production)
    implementation libs.caffeine
    
    // Observability
    implementation libs.bundles.micrometer
    implementation 'io.opentelemetry:opentelemetry-api'
    implementation 'io.opentelemetry:opentelemetry-sdk'
    implementation 'io.opentelemetry:opentelemetry-exporter-otlp'
    
    // Logging
    implementation libs.spring.boot.starter.log4j2
    
    // Actuator
    implementation libs.spring.boot.starter.actuator
    
    // Lombok
    compileOnly libs.lombok
    annotationProcessor libs.lombok
    
    // Jackson for JSON processing
    implementation libs.bundles.jackson
    
    // Testing
    testImplementation libs.spring.boot.starter.test
    testImplementation libs.bundles.testing
}

tasks.named('test') {
    useJUnitPlatform()
}

// Docker build task
tasks.register('buildDocker', Exec) {
    group = 'build'
    description = 'Build Docker image for gateway-service'
    dependsOn 'bootJar'
    
    workingDir projectDir
    commandLine 'docker', 'build', 
        '-t', "hzeroxium/${project.name}:latest",
        '-t', "hzeroxium/${project.name}:${project.version}",
        '.'
    
    doFirst {
        println "Building Docker image: hzeroxium/${project.name}:latest"
    }
    
    doLast {
        println "Docker image built successfully: hzeroxium/${project.name}:latest"
    }
}

