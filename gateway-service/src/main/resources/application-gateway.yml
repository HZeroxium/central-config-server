# Gateway Configuration
spring:
  cloud:
    gateway:
      # Global CORS configuration
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: ${GATEWAY_CORS_ALLOWED_ORIGINS:["*"]}
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
            maxAge: 3600
      
      # Default filters applied to all routes
      default-filters:
        - DedupeResponseHeader=Vary Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
        # CorrelationId is handled by CorrelationIdFilter (GlobalFilter)
      
      # Route definitions
      routes:
        # Config Control Service API
        - id: config-control-api
          uri: lb://config-control-service
          predicates:
            - Path=/api/**
          filters:
            # Circuit breaker with fallback
            - name: CircuitBreaker
              args:
                name: configControlService
                fallbackUri: forward:/fallback
            # Rate limiting per-user
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${GATEWAY_RATE_LIMIT_REPLENISH:100}
                redis-rate-limiter.burstCapacity: ${GATEWAY_RATE_LIMIT_BURST:200}
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userKeyResolver}"
            # Retry for idempotent requests
            # Note: Timeout is handled by httpclient.response-timeout (5s) and CircuitBreaker timelimiter
            - name: Retry
              args:
                retries: ${GATEWAY_RETRY_ATTEMPTS:3}
                statuses: BAD_GATEWAY,GATEWAY_TIMEOUT,INTERNAL_SERVER_ERROR
                methods: GET
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 500ms
                  factor: 2
                  basedOnPreviousValue: false
            # Add response headers
            - name: AddResponseHeader
              args:
                name: X-Gateway-Version
                value: "1.0.0"
      
      # HTTP client configuration
      httpclient:
        connect-timeout: 5000
        response-timeout: 5s
        pool:
          max-connections: 500
          max-idle-time: 30s

# Gateway-specific properties
gateway:
  fallback:
    enabled: true
    message: "Service temporarily unavailable. Please try again later."

