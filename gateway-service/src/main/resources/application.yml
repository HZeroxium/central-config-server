server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: gateway-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:gateway}
    group:
      gateway: "gateway,discovery,resilience,observability"
  config:
    import:
      - "classpath:application-gateway.yml"
      - "classpath:application-discovery.yml"
      - "classpath:application-resilience.yml"
      - "classpath:application-observability.yml"
      - "classpath:application-redis.yml"
      - "classpath:application-loadbalancer.yml"

# Logging Configuration
logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.example.gateway: ${LOGGING_LEVEL_COM_EXAMPLE_GATEWAY:DEBUG}
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web: INFO
    org.springframework.cloud: WARN
  config: classpath:log4j2-spring.xml

