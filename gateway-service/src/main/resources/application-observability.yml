# Observability Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,gateway
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${ENVIRONMENT:dev}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.9, 0.95, 0.99
  tracing:
    # Disabled - no OTLP endpoint available
    enabled: false
  prometheus:
    metrics:
      export:
        enabled: true

# Gateway metrics
spring:
  cloud:
    gateway:
      metrics:
        enabled: true

