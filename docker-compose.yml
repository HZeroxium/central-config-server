# docker-compose.config-server-min.yml
# Core application services (config-server, sample-service, config-control-service)
# Connects to external infra-network for infrastructure services

services:
  # Config Server
  config-server:
    build:
      context: ./config-server
      dockerfile: Dockerfile
    image: hzeroxium/config-server:latest
    container_name: config-server
    ports:
      - "28888:8888"
    env_file:
      - ./config/env/env.infra-remote
    environment:
      - SPRING_PROFILES_ACTIVE=native
      - SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS=file:/config-repo
      - CONFIG_GIT_URI=https://github.com/HZeroxium/ztf-spring-cloud-config-server.git
      - CONFIG_GIT_LABEL=master
      - SPRING_CLOUD_CONSUL_DISCOVERY_HEARTBEAT_ENABLED=true
      - SPRING_CLOUD_CONSUL_DISCOVERY_HEARTBEAT_TTL=10s
      - KAFKA_BROKERS=${KAFKA_BROKERS}
      - CONSUL_HOST=${CONSUL_HOST}
      - CONSUL_PORT=${CONSUL_PORT}
    volumes:
      - ./ztf-spring-cloud-config-server:/config-repo:ro
    networks:
      - infra-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # Sample Service
  sample-service:
    build:
      context: ./sample-service
      dockerfile: Dockerfile
    image: hzeroxium/sample-service:latest
    container_name: sample-service
    ports:
      - "28080:8080"
    env_file:
      - ./config/env/env.infra-remote
    environment:
      - CONFIG_SERVER_URL=${CONFIG_SERVER_URL}
      - SPRING_CLOUD_CONSUL_DISCOVERY_DEREGISTER_CRITICAL_SERVICE_AFTER=30s
      - SPRING_CLOUD_CONSUL_DISCOVERY_DEREGISTER=true
      - KAFKA_BROKERS=${KAFKA_BROKERS}
      - SPRING_PROFILES_ACTIVE=dev
      - ZCM_SDK_SERVICE_NAME=sample-service
      - ZCM_SDK_CONFIG_SERVER_URL=${CONFIG_SERVER_URL}
      - ZCM_SDK_DISCOVERY_CONSUL_HOST=${CONSUL_HOST}
      - ZCM_SDK_DISCOVERY_CONSUL_PORT=${CONSUL_PORT}
      - ZCM_SDK_DISCOVERY_CONSUL_HEARTBEAT_ENABLED=true
      - ZCM_SDK_DISCOVERY_CONSUL_REGISTER=true
      - ZCM_SDK_PING_ENABLED=true
      - ZCM_SDK_CONTROL_URL=${CONFIG_CONTROL_URL}
      # Observability
      - MANAGEMENT_OTLP_TRACING_ENDPOINT=${ALLOY_OTLP_HTTP}/v1/traces
      - MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED=true
      - MANAGEMENT_OTLP_METRICS_EXPORT_URL=${ALLOY_OTLP_HTTP}/v1/metrics
      # Virtual Threads
      # - SPRING_THREADS_VIRTUAL_ENABLED=false
      # - SPRING_MAIN_KEEP_ALIVE=false
      # - SERVER_TOMCAT_THREADS_MAX=10
    networks:
      - infra-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    stop_grace_period: 30s
    restart: unless-stopped

  # Config Control Service
  config-control-service:
    build:
      context: ./config-control-service
      dockerfile: Dockerfile
    image: hzeroxium/config-control-service:latest
    container_name: config-control-service
    ports:
      - "28081:8080"    # HTTP
      # - "9090:9090"    # Thrift
      # - "9092:9091"    # gRPC
    env_file:
      - ./config/env/env.infra-remote
    environment:
      - CONFIG_SERVER_URL=${CONFIG_SERVER_URL}
      - CONSUL_URL=http://${CONSUL_HOST}:${CONSUL_PORT}
      - SPRING_CLOUD_CONSUL_DISCOVERY_HEARTBEAT_ENABLED=true
      - SPRING_CLOUD_CONSUL_DISCOVERY_HEARTBEAT_TTL=10s
      - MONGODB_URI=mongodb://${MONGODB_HOST}:${MONGODB_PORT}/config_control
      - REDIS_URL=redis://${REDIS_HOST}:${REDIS_PORT}
      - KAFKA_BROKERS=${KAFKA_BROKERS}
      - THRIFT_PORT=9090
      - GRPC_PORT=9091
      - LOGGING_LEVEL_ROOT=INFO
      - MANAGEMENT_HEALTH_MAIL_ENABLED=false
      # Observability
      # - MANAGEMENT_OTLP_TRACING_ENDPOINT=${ALLOY_OTLP_HTTP}/v1/traces
      # - MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED=true
      # - MANAGEMENT_OTLP_METRICS_EXPORT_URL=${ALLOY_OTLP_HTTP}/v1/metrics
      # Keycloak configuration
      # - KEYCLOAK_ISSUER_URI=http://keycloak:8080/realms/config-control
      - KEYCLOAK_ISSUER_URI=http://10.40.30.161:28080/realms/config-control
      # KEYCLOAK_PUBLIC_URL for Swagger UI OAuth2 (browser-accessible URL)
      # This should match where users access the service from browser
      - KEYCLOAK_PUBLIC_URL=http://10.40.30.161:28080
      - KEYCLOAK_REALM=config-control
      - KEYCLOAK_AUDIENCE=config-control-service
      - KEYCLOAK_ADMIN_URL=http://10.40.30.161:28080
      - KEYCLOAK_CLIENT_ID=config-control-service
      - KEYCLOAK_CLIENT_SECRET=config-control-service-secret
      - KEYCLOAK_PARENT_GROUP_ID=3b7eccae-859a-437e-81af-0ab909c8d67a
      # Swagger UI OAuth2 redirect URL (must be accessible from browser)
      # - SWAGGER_OAUTH2_REDIRECT_URL=http://10.40.30.161:28081/swagger-ui/oauth2-redirect.html
      - SWAGGER_OAUTH2_REDIRECT_URL=http://localhost:28081/swagger-ui/oauth2-redirect.html
      # Seeding
      - SEEDING_ENABLED=true
      - SPRING_MAIL_HOST=10.40.30.161
      - SPRING_MAIL_PORT=1025
      # Heartbeat
      - HEARTBEAT_ASYNC_ENABLED=true
    networks:
      - infra-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # Admin Dashboard
  admin-dashboard:
    build:
      context: .
      dockerfile: ./admin-dashboard/Dockerfile
      args:
        # Build-time environment variables (Vite bakes these into the bundle)
        # Note: Build args can use environment variables from shell or .env file
        # For local: export KEYCLOAK_PUBLIC_URL=http://localhost:28080 before building
        # For production: export KEYCLOAK_PUBLIC_URL=http://10.40.30.161:28080 before building
        # Or create .env file in project root with KEYCLOAK_PUBLIC_URL=<value>
        # - VITE_API_BASE_URL=/api  # Use relative path, nginx will proxy to backend
        - VITE_KEYCLOAK_URL=${KEYCLOAK_PUBLIC_URL:-http://localhost:28080}  # Browser-accessible URL (use - for default, not :)
        - VITE_KEYCLOAK_REALM=config-control
        - VITE_KEYCLOAK_CLIENT_ID=admin-dashboard
    image: hzeroxium/admin-dashboard:latest
    container_name: admin-dashboard
    env_file:
      # Load environment variables for reference (build args need shell/env vars)
      # For local: use env.infra-local
      # For production: use env.infra-remote
      - ./config/env/env.infra-remote
    ports:
      - "3000:80"
    networks:
      - infra-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

networks:
  infra-network:
    # external: true
    name: infra-network
